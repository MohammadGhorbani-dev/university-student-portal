name: Firestore security validation

on:
  push:
    branches: [codex/portal-security-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate rules using synthetic local data only
        env:
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
          CI: 'true'
        run: >-
          npx --yes --package firebase-tools@15.28.1 firebase emulators:exec
          --project demo-portal-audit --only firestore
          --config firebase.validation.json
          'node validation/firestore-rules.mjs'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: firestore-validation-evidence
          path: |
            validation/rules-results.json
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7
