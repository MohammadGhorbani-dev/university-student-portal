name: Firestore security validation

on:
  push:
    branches: [main, codex/portal-security-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: node --test validation/migration.test.mjs
      - run: npm run build:demo
      - name: Validate rules using synthetic local data only
        env:
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
          CI: 'true'
        run: >-
          npx --yes --package firebase-tools@15.28.1 firebase emulators:exec
          --project demo-portal-audit --only firestore
          --config firebase.validation.json
          'node validation/firestore-integration.mjs'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: firestore-validation-evidence
          path: |
            validation/rules-results.json
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install browser for public form regression tests
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile forms without production credentials
        run: npx playwright test --project=chromium --project='Mobile Chrome' --reporter=line
      - name: Check standalone demo workflows with external network blocked
        run: npx playwright test --config playwright.demo.config.js
      - name: Save standalone demo build
        uses: actions/upload-artifact@v5
        with:
          name: university-portal-standalone-demo
          path: dist-demo/
          retention-days: 7
